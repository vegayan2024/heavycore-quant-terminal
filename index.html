<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="重器·周期反转与细分国企隐形冠军·量化投研工作站 - 基于张新民财报分析法、供需剪刀差与60/40双轨交易体系">
  <title>重器 · 周期国企隐形冠军量化投研终端</title>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Hallmark Theme Stylesheets -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/report.css">
  <link rel="stylesheet" href="css/universe.css">
</head>
<body>

<div class="app-wrapper">
  <!-- 顶部导航与快捷控制栏 -->
  <header class="top-navbar">
    <div class="brand-section">
      <div class="brand-logo">
        <span style="font-size: 18px; color: var(--color-brand);">⚡</span>
        <span>HEAVYCORE QUANT</span>
      </div>
      <span class="brand-badge">国企周期重器 V3.5</span>
    </div>

    <!-- 标的快速切换药丸 (常用快捷入口) -->
    <div class="stock-selector-pills">
      <button class="stock-pill-btn active" data-code="600409">
        <span>三友化工</span>
        <span style="font-family: var(--font-mono); font-size: 11px; opacity: 0.8;">600409</span>
      </button>
      <button class="stock-pill-btn" data-code="000422">
        <span>湖北宜化</span>
        <span style="font-family: var(--font-mono); font-size: 11px; opacity: 0.8;">000422</span>
      </button>
      <button class="stock-pill-btn" data-code="000657">
        <span>中钨高新</span>
        <span style="font-family: var(--font-mono); font-size: 11px; opacity: 0.8;">000657</span>
      </button>
    </div>

    <!-- 视图模式切换与数据管理按钮 -->
    <div class="nav-actions">
      <button class="action-btn" id="btnOpenDataHub" style="display: flex; align-items: center; gap: 6px; border-color: var(--color-brand); color: var(--color-brand);">
        <span>📥</span>
        <span>数据管理 (全渠道导入)</span>
      </button>

      <div class="view-mode-tabs">
        <button class="view-tab-btn" data-view="universe">🎯 总标的库 (3大梯队)</button>
        <button class="view-tab-btn active" data-view="workstation">📊 投研工作台</button>
        <button class="view-tab-btn" data-view="report">📑 机构级研报 (ShengFund)</button>
      </div>
    </div>
  </header>

  <!-- 主体工作区 -->
  <main class="main-container">
    <!-- 标的实时摘要条 (Header Ticker - 工作台与研报可见) -->
    <div class="ticker-summary-bar" id="tickerSummaryBar"></div>

    <!-- 视图 1：总标的库 (三大等级梯队) -->
    <div class="universe-view-container" id="universeContainer"></div>

    <!-- 视图 2：量化投研工作台 -->
    <div class="workstation-grid" id="workstationContainer">
      <!-- 左列：三票否决与决策打分盘 -->
      <div class="column-left" id="vetoScorecardContainer"></div>

      <!-- 中列：供需剪刀差图表 + 产能利用率 + 库存钟 + 张新民财报面板 -->
      <div class="column-center">
        <!-- 图表 1：产品-原料剪刀差走势图 -->
        <div class="terminal-card">
          <div class="card-header">
            <div class="card-title">
              <span class="card-title-icon">📈</span> 产品-原料“剪刀差”高频趋势图 (单位: 元/吨)
            </div>
            <div style="display: flex; gap: 6px;">
              <span class="badge badge-info" style="font-size: 10px;">来源: 兴业高频数据库</span>
              <span class="badge badge-success">剪刀差持续走阔</span>
            </div>
          </div>
          <div class="chart-container-box" style="height: 220px;">
            <canvas id="canvasSpreadChart"></canvas>
          </div>
        </div>

        <!-- 图表 2 与 图表 3 (并列双图) -->
        <div style="display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px;">
          <!-- 产能-实际产量-开工率联动图 -->
          <div class="terminal-card">
            <div class="card-header">
              <div class="card-title">
                <span class="card-title-icon">🏭</span> 产能利用率 vs 行业平均
              </div>
              <span class="badge badge-info">逆势满产满销</span>
            </div>
            <div class="chart-container-box" style="height: 190px;">
              <canvas id="canvasCapacityChart"></canvas>
            </div>
          </div>

          <!-- 库存周期四象限钟 -->
          <div class="terminal-card">
            <div class="card-header">
              <div class="card-title">
                <span class="card-title-icon">🎯</span> 库存周期定位钟
              </div>
              <span class="badge badge-success">处于黄金买点</span>
            </div>
            <div class="chart-container-box" style="height: 190px;">
              <canvas id="canvasCycleClock"></canvas>
            </div>
          </div>
        </div>

        <!-- 张新民财报深度诊断面板 -->
        <div id="zhangXinminContainer"></div>
      </div>

      <!-- 右列：60/40 仓位双轨执行台 + 弹性模拟器 -->
      <div class="column-right" id="positionManagerContainer"></div>
    </div>

    <!-- 视图 3：ShengFund 大包子风格全景研报视图 -->
    <div class="report-view-container" id="reportContainer"></div>
  </main>
</div>

<!-- 全兼容本地 Bundle 脚本加载 (支持直接双击 file:/// 打开与本地 HTTP 服务) -->
<script src="js/bundle.js"></script>

</body>
</html>
